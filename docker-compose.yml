version: "3.9"

services:
  # ── PostgreSQL DB ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saju_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saju_db
      POSTGRES_USER: saju_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./oracle_setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saju_app -d saju_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 외부 노출 안 함 (앱 컨테이너만 접근)
    expose:
      - "5432"

  # ── Streamlit 앱 ─────────────────────────────────────────────────
  app:
    build: .
    container_name: saju_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgresql://saju_app:${POSTGRES_PASSWORD}@postgres:5432/saju_db
      ADMIN_KEY: ${ADMIN_KEY}
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Nginx 리버스 프록시 ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saju_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./oracle_setup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  # ── Certbot (Let's Encrypt SSL, 선택) ────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: saju_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pg_data:
  certbot_www:
  certbot_conf:
